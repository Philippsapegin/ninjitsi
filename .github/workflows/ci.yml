name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22.23.2

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run unit and integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build production assets
        run: npm run build:cloudflare

      - name: Run browser smoke checks
        shell: bash
        run: |
          JITSI_AUTH_MODE=open node server/server.mjs > /tmp/ninjitsi-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          curl --fail --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:3000/api/health
          npm run smoke:rooms
          npm run smoke:profiles
          npm run smoke:visual

      - name: Validate hardened Docker deployment
        shell: bash
        env:
          JITSI_JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JITSI_URL: https://jitsi.example.test
          NINJITSI_PORT: 127.0.0.1:3100
        run: |
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes || true
          }
          trap cleanup EXIT

          docker compose config --quiet
          docker compose up --detach --build
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:3100/api/health
          test "$(docker compose exec -T web id -u | tr -d '\r')" = "1000"
          test "$(docker inspect ninjitsi-web-1 --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect ninjitsi-web-1 --format '{{index .HostConfig.CapDrop 0}}')" = "ALL"
          test "$(docker compose port web 8080)" = "127.0.0.1:3100"
          test "$(docker inspect ninjitsi-data-init-1 --format '{{.State.ExitCode}}')" = "0"
          docker compose exec -T web test ! -e /app/.env
